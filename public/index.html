<style>
:root {
  --bg: #eef3f2; --surface: #ffffff; --ink: #12292b; --muted: #54696b; --line: #d3e0de;
  --accent: #0e3b43; --accent-ink: #ffffff; --amber: #f4b63f;
  --danger: #b3261e; --danger-bg: #fdecea; --warn-bg: #fff3d6; --warn: #8a5a00;
  --c0: #6a4fb3; --c1: #1d6fb8; --c2: #b8620f; --c3: #1f7a5a; --c4: #a3366b;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1819; --surface: #152426; --ink: #e6f1ef; --muted: #93aeab; --line: #254043;
    --accent: #4fc3b5; --accent-ink: #062320; --danger: #ff8a80; --danger-bg: #3a1c1a; --warn-bg: #3a2d0c; --warn: #f2c45a;
    --c0: #b9a4ff; --c1: #7ab8f0; --c2: #f0a85a; --c3: #6fd3a4; --c4: #f09ac4;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 30px; letter-spacing: -0.01em; }
h2 { font-size: 20px; }
p { margin: 0; }
a { color: var(--accent); font-weight: 600; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.brand { color: var(--ink); display: flex; justify-content: space-between; align-items: center; }
.brand .tag { color: var(--muted); font-size: 13px; }
header { display: flex; flex-direction: column; gap: 6px; }
.sub { color: var(--muted); font-size: 15px; }
.call { display: inline-flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 15px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.btn { min-height: 52px; padding: 0 18px; border-radius: 12px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 700 16px var(--body); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.big { min-height: 64px; font-size: 20px; width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.linkbtn { display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; padding: 8px 16px; line-height: 1.2; font-weight: 700; }
.linkish { background: none; border: 0; padding: 8px 4px; color: var(--accent); font: 600 14px var(--body); text-decoration: underline; cursor: pointer; min-height: 44px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.thumb { position: relative; }
.thumb img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.thumb .x { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: #0e3b43cc; color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
.status { font-size: 14px; color: var(--muted); min-height: 20px; }
.err { color: var(--danger); font-weight: 600; }

/* Editor */
.med { border: 1px solid var(--line); border-left: 6px solid var(--c, var(--accent)); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.flagnote { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-weight: 600; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
.fields label, .petname { display: flex; flex-direction: column; gap: 2px; font-size: 13px; font-weight: 600; color: var(--muted); }
.fields input[type="text"], .fields input[type="number"], .fields input[type="datetime-local"], .petname input { min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--bg); color: var(--ink); font: 500 16px var(--body); width: 100%; }
.fields .wide { grid-column: 1 / -1; }
.check { display: flex; gap: 8px; align-items: center; font-size: 15px; font-weight: 600; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }

/* Next up */
.next { border: 2px solid var(--c, var(--accent)); gap: 6px; }
.next .label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.next .when { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.next .what { font-size: 18px; font-weight: 600; }
.next .how { color: var(--muted); }
.next button { align-self: flex-start; margin-top: 6px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 700 15px var(--body); cursor: pointer; }
.progress { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--amber); border-radius: 99px; }

/* Days + doses */
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daynav .title { text-align: center; flex: 1; }
.daynav .title h2 { font-size: 22px; }
.daynav .title span { color: var(--muted); font-size: 14px; }
.navbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 20px; cursor: pointer; }
.navbtn:disabled { opacity: .35; cursor: default; }
.doses { display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.dose { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 12px; padding: 12px 12px 12px 10px; }
.dose.done { opacity: .62; }
.dose .time { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.dose .time small { display: block; font-family: var(--body); font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.dose .body { display: flex; flex-direction: column; gap: 4px; }
.dose .kind { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--c); }
.dose .name { font-weight: 700; }
.dose .name span { color: var(--c); }
.dose .amount { font-size: 18px; font-weight: 600; }
.dose .note { color: var(--muted); font-size: 14px; }
.givebtn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 700 15px var(--body); cursor: pointer; align-self: flex-start; margin-top: 4px; }
.givebtn[aria-pressed="true"] { background: transparent; color: var(--accent); }
.givebtn:disabled { opacity: .4; cursor: not-allowed; }
.every { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 15px; margin: 0; }
.every dt { font-weight: 700; }
.every dd { margin: 0; color: var(--muted); }
.stop { background: var(--danger-bg); border-color: var(--danger); }
.stop h2 { color: var(--danger); }
ul.plain { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.foot { color: var(--muted); font-size: 13px; }
details.fold > summary { font: 600 17px var(--display); cursor: pointer; list-style: none; min-height: 32px; display: flex; align-items: center; justify-content: space-between; }
details.fold > summary::after { content: "+"; font-size: 24px; color: var(--accent); }
details.fold[open] > summary::after { content: "\2212"; }
details.fold > :not(summary) { margin-top: 12px; }
@media print { .noprint, .btn, .givebtn, .navbtn { display: none !important; } body { background: #fff; } .card { break-inside: avoid; } }
@media (max-width: 380px) { .dose { grid-template-columns: 62px 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 48px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: 600 15px var(--body); cursor: pointer; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); color: var(--ink); font: 500 16px var(--body); resize: vertical; box-sizing: border-box; }
.dotl { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--c3); flex: none; }
.dotl.l1 { background: var(--amber); }
.dotl.l2 { background: var(--danger); }
.missed { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; }
.entry { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.callbtn { background: var(--danger); border-color: var(--danger); color: #fff; }
.rule { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 500 15px var(--body); cursor: pointer; }
.rule .box { flex: none; width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--accent); display: grid; place-items: center; font-weight: 800; color: var(--accent-ink); }
.rule.on { opacity: .75; } .rule.on .box { background: var(--accent); } .rule.on span:last-child { text-decoration: line-through; }
.logtimes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.logchip { display: inline-flex; align-items: center; gap: 4px; background: var(--tint, var(--bg)); border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 13px; font-weight: 600; }
.logchip button { background: none; border: 0; min-width: 32px; min-height: 32px; color: var(--muted); font-size: 18px; cursor: pointer; }
.datebox { background: var(--warn-bg); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
</style>

      if (m.asNeeded) return { m: m, prn: (S.prn[m.id] || []).length };
      var d = all.filter(function (x) { return x.med.id === m.id; }), due = d.filter(function (x) { return x.when.getTime() <= now; });
      var g = due.filter(function (x) { return S.given[x.id]; }).length, sk = due.filter(function (x) { return S.skipped[x.id]; }).length;
      return { m: m, total: d.length, due: due.length, given: g, skipped: sk, missed: due.length - g - sk };
    });
  }
  function adhText(r) { return r.prn != null ? "As needed, " + r.prn + " dose" + (r.prn === 1 ? "" : "s") + " logged" : r.given + " of " + r.due + " doses given so far (" + r.total + " in the plan)" + (r.skipped ? ", " + r.skipped + " skipped" : "") + (r.missed ? ", " + r.missed + " missed" : ""); }
  function summaryText() {
    var o = [(S.patient || "Pet") + " recovery summary (Pawsie)"]; if (S.summary) o.push(S.summary); o.push("", "Medicines:");
    adherence().forEach(function (r) { o.push(r.m.name + ": " + adhText(r)); });
    o.push("", "Daily check-ins:"); if (!S.checkins.length) o.push("None yet");
    S.checkins.forEach(function (c) { var l = level(c.a); o.push(fmtDay(new Date(c.t)) + " " + fmtTime(new Date(c.t)) + " [" + (l === 2 ? "CALL" : l === 1 ? "WATCH" : "good") + "] " + CQ.filter(function (q) { return c.a[q.k]; }).map(function (q) { return q.q + " " + label(q.k, c.a[q.k]); }).join("; ") + (c.note ? ". Note: " + c.note : "")); });
    if (S.questions) o.push("", "Questions for the vet: " + S.questions);
    return o.join("\n");
  }
  function vSummary() {
    var w = el("div", { style: "display:flex;flex-direction:column;gap:12px" });
    w.appendChild(el("header", {}, [el("h1", { text: (S.patient || "Your pet") + "'s recovery summary" }), S.summary ? el("p", { class: "sub", text: S.summary }) : null, el("p", { class: "sub", text: "Made " + fmtDay(new Date()) + " with Pawsie" })]));
    w.appendChild(el("section", { class: "card" }, [el("h2", { text: "Medicines" }), el("dl", { class: "every" }, adherence().reduce(function (a, r) { a.push(el("dt", { text: r.m.name })); a.push(el("dd", { text: adhText(r) + "." })); return a; }, []))]));
    var ci = el("section", { class: "card" }, [el("h2", { text: "Daily check-ins" })]);
    if (!S.checkins.length) ci.appendChild(el("p", { class: "muted", text: "No check-ins yet." }));
    S.checkins.slice().reverse().forEach(function (c) {
      var l = level(c.a), parts = CQ.filter(function (q) { return c.a[q.k]; }).map(function (q) { return q.q + ": " + label(q.k, c.a[q.k]); });
      ci.appendChild(el("div", { class: "entry" }, [el("div", { class: "row" }, [dot(l), el("b", { text: fmtDay(new Date(c.t)) + " " + fmtTime(new Date(c.t)) })]), el("p", { class: "small muted", text: parts.join(" · ") + (c.note ? " · Note: " + c.note : "") }), c.photo ? el("img", { src: c.photo, alt: "Incision photo", style: "max-width:140px;border-radius:8px;border:1px solid var(--line)" }) : null]));
    });
    w.appendChild(ci);
    var qn = el("textarea", { rows: "3", placeholder: "Questions to ask at the recheck", oninput: function (e) { S.questions = e.target.value; save(); clearTimeout(qT); qT = setTimeout(function () { op({ t: "questions", v: S.questions }); }, 800); } }); qn.value = S.questions || "";
    w.appendChild(el("section", { class: "card" }, [el("h2", { text: "Questions for the vet" }), qn]));
    var cb = el("button", { class: "btn ghost", type: "button", text: "Copy as text", onclick: function () { try { navigator.clipboard.writeText(summaryText()).then(function () { cb.textContent = "Copied"; }, function () { window.prompt("Copy:", summaryText()); }); } catch (e) { window.prompt("Copy:", summaryText()); } } });
    w.appendChild(el("div", { class: "row noprint" }, [cb, el("a", { class: "btn ghost linkbtn", href: "sms:?&body=" + encodeURIComponent(summaryText()), text: "Text it" }), el("button", { class: "btn ghost", type: "button", text: "Print or save PDF", onclick: function () { window.print(); } })]));
    w.appendChild(el("button", { class: "linkish noprint", type: "button", style: "align-self:flex-start", text: "Back to the plan", onclick: function () { S.view = "plan"; render(); window.scrollTo(0, 0); } }));
    w.appendChild(el("p", { class: "foot", text: "Records what the owner reports. Pawsie doesn't diagnose or replace your veterinarian." }));
    return w;
  }

  function render() {
    if (S.view === "plan" && S.meds.length && !S.synced) syncPlan();
    var v = document.getElementById("view"); v.innerHTML = "";
    v.appendChild(S.view === "plan" && S.meds.length ? vPlan() : S.view === "check" ? vCheck() : S.view === "checkin" ? vCheckin() : S.view === "result" ? vResult() : S.view === "summary" ? vSummary() : vIntake());
  }
  render();
  checkPush();
  if (H) { poll(); } else ensureHousehold();
})();
</script>
